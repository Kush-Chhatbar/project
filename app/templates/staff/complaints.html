{% extends "base.html" %}

{% block title %}Assigned Complaints{% endblock %}

{% block body %}
<div data-layout="staff">
  <div class="page-header">
    <h1>Assigned complaints</h1>
    <p>Complaints routed to you. Move them through the workflow and document the fix.</p>
  </div>

  <div class="card">
    <div class="filter-bar" style="margin-bottom:16px">
      <div class="form-field">
        <label for="filter-status">Status</label>
        <select class="input" id="filter-status">
          <option value="">All statuses</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-priority">Priority</label>
        <select class="input" id="filter-priority">
          <option value="">All priorities</option>
          <option value="Critical">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-category">Category</label>
        <select class="input" id="filter-category">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="form-field form-field--compact">
        <button type="button" class="btn btn--ghost" id="clear-filters">Clear</button>
      </div>
    </div>
    <div id="complaints-container" aria-live="polite"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/layout.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/staff/complaints.js') }}"></script>
{% endblock %}
