{% extends "base.html" %}

{% block title %}Complaint Management{% endblock %}

{% block body %}
<div data-layout="admin">
  <div class="page-header">
    <h1>Complaint management</h1>
    <p>Route new complaints to departments and staff, and track them to resolution.</p>
  </div>

  <div class="card">
    <div class="filter-bar" style="margin-bottom:16px">
      <div class="form-field">
        <label for="filter-status">Status</label>
        <select class="input" id="filter-status">
          <option value="">All statuses</option>
          <option value="New">New</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
          <option value="Closed">Closed</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-priority">Priority</label>
        <select class="input" id="filter-priority">
          <option value="">All priorities</option>
          <option value="Critical">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-category">Category</label>
        <select class="input" id="filter-category">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-department">Department</label>
        <select class="input" id="filter-department">
          <option value="">All departments</option>
        </select>
      </div>
      <div class="form-field">
        <label for="filter-from">From</label>
        <input class="input" type="date" id="filter-from">
      </div>
      <div class="form-field">
        <label for="filter-to">To</label>
        <input class="input" type="date" id="filter-to">
      </div>
      <div class="form-field">
        <label for="filter-search">Search</label>
        <input class="input" type="search" id="filter-search" placeholder="Guest, room, text…">
      </div>
      <div class="form-field form-field--compact">
        <button type="button" class="btn btn--ghost" id="clear-filters">Clear</button>
      </div>
    </div>
    <div id="complaints-container" aria-live="polite"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/layout.js') }}"></script>
<script src="{{ url_for('static', filename='js/pages/admin/complaints.js') }}"></script>
{% endblock %}
